<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habits</title><link rel="stylesheet" href="../assets/suite.css">
<style>.hg{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;overflow:auto;padding-bottom:4px}.hg i{width:11px;height:11px;background:var(--line);display:block}.hg i.on{background:var(--paper)}.hg i.today{outline:1px solid var(--dim-3)}.hg i.fut{opacity:.2}</style></head>
<body data-app="habits"><div id="app"><div class="row" style="margin-bottom:16px"><button class="btn primary" id="add">+ New habit</button><span class="small muted">Click a square to toggle that day. Use the button to check off today.</span></div><div id="list"></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  let habits=SU.store.get('habits',[]); const save=()=>SU.store.set('habits',habits);
  const key=d=>d.getFullYear()+'-'+SU.pad(d.getMonth()+1)+'-'+SU.pad(d.getDate());
  function streak(h){ let s=0,d=new Date(); if(!h.days[key(d)]) d.setDate(d.getDate()-1); while(h.days[key(d)]){ s++; d.setDate(d.getDate()-1); } return s; }
  function best(h){ const ks=Object.keys(h.days).filter(k=>h.days[k]).sort(); let b=0,c=0,p=null; ks.forEach(k=>{ const d=new Date(k+'T00:00:00'); c=(p&&Math.round((d-p)/864e5)===1)?c+1:1; b=Math.max(b,c); p=d; }); return b; }
  function draw(){
    const L=SU.$('#list'); L.innerHTML=''; if(!habits.length){ L.append(SU.h('div',{class:'empty panel'},'No habits yet')); return; }
    const now=new Date(), t=key(now);
    habits.forEach(h=>{
      const g=SU.h('div',{class:'hg'}); const start=new Date(now); start.setDate(start.getDate()-(12*7-1)-((now.getDay()+6)%7)+((now.getDay()+6)%7));
      start.setDate(now.getDate()-((now.getDay()+6)%7)-77);
      for(let i=0;i<91;i++){ const d=new Date(start); d.setDate(start.getDate()+i); const k=key(d), fut=k>t;
        g.append(SU.h('i',{class:(h.days[k]?'on ':'')+(k===t?'today ':'')+(fut?'fut':''),title:k,onclick:()=>{ if(fut) return; h.days[k]=!h.days[k]; save(); draw(); }})); }
      const done=!!h.days[t], total=Object.values(h.days).filter(Boolean).length;
      L.append(SU.h('div',{class:'panel'},
        SU.h('div',{class:'row',style:'justify-content:space-between;margin-bottom:12px'},
          SU.h('div',null,SU.h('div',{style:'font-size:15px'},h.name),SU.h('div',{class:'small muted'},'🔥 '+streak(h)+' day streak · best '+best(h)+' · '+total+' total')),
          SU.h('div',{class:'row'},SU.h('button',{class:'btn sm '+(done?'':'primary'),onclick:()=>{ h.days[t]=!done; save(); draw(); }},done?'Undo today':'Done today'),
            SU.h('button',{class:'btn sm ghost danger',onclick:async()=>{ if(await SU.confirm('Delete "'+h.name+'" and its history?')){ habits=habits.filter(x=>x!==h); save(); draw(); } }},'×'))),g));
    });
  }
  SU.$('#add').onclick=async()=>{ const n=await SU.prompt('New habit','','e.g. Practice 30 min'); if(n&&n.trim()){ habits.push({id:SU.uid(),name:n.trim(),days:{}}); save(); draw(); } };
  draw();
});
</script></body></html>
