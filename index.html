<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Suite</title><link rel="stylesheet" href="assets/suite.css"></head>
<body data-app="home"><div id="app">
<div class="eyebrow"><span class="dot-pulse"></span><span id="eyebrow">Private workspace</span></div>
<div class="page-head" style="margin-top:10px"><h1 id="greet">Welcome back.</h1><p id="stamp" class="mono" style="letter-spacing:.14em;text-transform:uppercase;font-size:10.5px"></p></div>
<div class="stats" id="stats" style="margin-bottom:26px"></div>

<div class="cols two" style="margin-bottom:8px">
  <div class="panel corners" style="margin:0"><h2>Quick capture</h2>
    <input type="text" id="cap" placeholder="Idea, task, lyric, reminder…  (Enter = task)">
    <div class="row" style="margin-top:10px"><button class="btn sm primary" data-cap="task">+ Task</button><button class="btn sm" data-cap="note">+ Note</button><button class="btn sm" data-cap="scratch">+ Scratchpad</button></div></div>
  <div class="panel" style="margin:0"><h2>Jump back in</h2><div class="chips" id="recent"></div><div class="hr"></div><h2>Find an app</h2><input type="search" id="find" placeholder="Filter apps…"><div class="small muted" style="margin-top:8px">Tip: <kbd>Ctrl</kbd> <kbd>K</kbd> opens the command palette anywhere.</div></div>
</div>
<div id="cats"></div></div>
<script src="assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$, h=SU.h, cfg=SU.getCfg()||{}, hr=new Date().getHours();
  $('#greet').textContent=(hr<5?'Late one':hr<12?'Good morning':hr<18?'Good afternoon':'Good evening')+(cfg.name?', '+cfg.name:'')+'.';
  $('#eyebrow').textContent=(cfg.wordmark||'SUITE')+' · private workspace';
  const stampF=()=>{ $('#stamp').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',year:'numeric',month:'long',day:'numeric'})+' · '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); };
  stampF(); setInterval(stampF,15000);

  function stats(){
    const tasks=SU.store.get('tasks',[]), open=tasks.filter(t=>!t.done), od=open.filter(t=>t.due&&t.due<SU.today()).length;
    const habits=SU.store.get('habits',[]), td=SU.today(), hd=habits.filter(x=>x.days&&x.days[td]).length;
    const ev=SU.store.get('countdowns',[]).filter(e=>e.when&&new Date(e.when)>Date.now()).sort((a,b)=>a.when.localeCompare(b.when))[0];
    const d=ev?Math.ceil((new Date(ev.when)-Date.now())/864e5):null;
    const data=[[open.length+(od?' · '+od+' late':''),'Open tasks'],[habits.length?hd+' / '+habits.length:'—','Habits today'],[SU.store.get('notes',[]).length,'Notes'],[ev?d+'d':'—',ev?'Until '+ev.name.slice(0,22):'Next countdown']];
    $('#stats').innerHTML=data.map(([n,l])=>'<div class="stat"><div class="n">'+SU.esc(n)+'</div><div class="l">'+SU.esc(l)+'</div></div>').join('');
  }
  stats();

  function capture(kind){
    const v=$('#cap').value.trim(); if(!v) return;
    if(kind==='task'){ const t=SU.store.get('tasks',[]); t.push({id:SU.uid(),created:Date.now(),task:v,area:'Life',priority:'Med',due:'',done:false,notes:''}); SU.store.set('tasks',t); }
    else if(kind==='note'){ const n=SU.store.get('notes',[]); n.push({id:SU.uid(),title:v.slice(0,60),body:v,pin:false,updated:Date.now()}); SU.store.set('notes',n); }
    else SU.store.set('scratch',(SU.store.get('scratch','')+'\n['+new Date().toLocaleString('en-GB')+'] '+v).trim());
    $('#cap').value=''; SU.toast('Added to '+kind); stats();
  }
  $('#cap').addEventListener('keydown',e=>{ if(e.key==='Enter') capture('task'); });
  SU.$$('[data-cap]').forEach(b=>b.onclick=()=>capture(b.dataset.cap));

  const rec=SU.store.get('recent',[]).map(SU.appById).filter(Boolean);
  $('#recent').innerHTML=''; if(rec.length) rec.forEach(a=>$('#recent').append(h('a',{class:'tag chip',href:SU.appUrl(a.id)},a.name))); else $('#recent').append(h('span',{class:'small muted'},'Apps you open show up here'));

  function cats(q){
    const box=$('#cats'); box.innerHTML='';
    Object.keys(SU.CATS).forEach(c=>{
      const apps=SU.APPS.filter(a=>a.cat===c&&(!q||(a.name+' '+a.desc).toLowerCase().includes(q))); if(!apps.length) return;
      box.append(h('div',{class:'section-label',id:c},SU.CATS[c]+' · '+apps.length),
        h('div',{class:'grid'},apps.map(a=>h('a',{class:'card',href:SU.appUrl(a.id)},h('div',{class:'row',style:'justify-content:space-between'},h('span',{class:'tag'},SU.CATS[a.cat])),
          h('div',null,h('div',{class:'title'},a.name),h('div',{class:'desc'},a.desc)),h('div',{class:'arrow'},'→')))));
    });
    if(!box.children.length) box.append(h('div',{class:'empty'},'No apps match'));
  }
  cats(''); $('#find').addEventListener('input',e=>cats(e.target.value.toLowerCase().trim()));
  if(location.hash){ const t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(()=>t.scrollIntoView(),400); }
});
</script></body></html>
