<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Board</title><link rel="stylesheet" href="../assets/suite.css">
<style>.kb{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:12px;overflow-x:auto;align-items:start}.col{background:var(--panel);border:1px solid var(--line);min-height:240px;padding:10px}.col.over{border-color:var(--paper)}.col h3{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between;margin:2px 2px 10px;font-weight:600}.kc{background:var(--panel-3);border:1px solid var(--line);padding:11px;margin-bottom:8px;cursor:grab}.kc:hover{border-color:var(--line-2)}.kc .t{font-size:13px;margin-bottom:6px}.kc .m{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.kc.drag{opacity:.4}</style></head>
<body data-app="projects"><div id="app">
<div class="row" style="margin-bottom:14px"><button class="btn primary" id="add">+ New card</button><select id="ft" style="width:auto"><option value="">All types</option></select><span class="small muted">Drag cards between columns · click to edit</span></div>
<div class="kb" id="kb"></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$, h=SU.h, COLS=['Idea','Active','Blocked','Done'], TYPES=['Music','Film','Photo','Lab','College','Other'];
  let items=SU.store.get('projects',[]), filt='', dragId=null; const save=()=>SU.store.set('projects',items);
  TYPES.forEach(t=>$('#ft').append(h('option',{value:t},t))); $('#ft').onchange=()=>{ filt=$('#ft').value; draw(); };
  const fields=[{k:'title',l:'Title',req:true},{k:'type',l:'Type',t:'select',opts:TYPES,def:'Music'},{k:'col',l:'Column',t:'select',opts:COLS,def:'Idea'},{k:'due',l:'Due',t:'date'},{k:'notes',l:'Notes',t:'area'}];
  async function edit(it,col){
    const f=SU.buildForm(fields,it||{col:col||'Idea'}), acts=[{label:'Cancel',cls:'ghost',value:null}]; if(it) acts.unshift({label:'Delete',cls:'danger ghost',value:'del'});
    acts.push({label:'Save',cls:'primary',value:'save',validate:()=>{ if(!f.get().title){ SU.toast('Title required'); return false; } }});
    const r=await SU.modal(it?'Edit card':'New card',f.el,acts);
    if(r==='del'){ items=items.filter(x=>x!==it); save(); draw(); } else if(r==='save'){ const d=f.get(); if(it) Object.assign(it,d); else items.push(Object.assign({id:SU.uid()},d)); save(); draw(); } }
  function draw(){ const kb=$('#kb'); kb.innerHTML=''; const td=SU.today();
    COLS.forEach(c=>{ const list=items.filter(i=>i.col===c&&(!filt||i.type===filt));
      const col=h('div',{class:'col',ondragover:e=>{ e.preventDefault(); col.classList.add('over'); },ondragleave:()=>col.classList.remove('over'),ondrop:e=>{ e.preventDefault(); col.classList.remove('over'); const it=items.find(x=>x.id===dragId); if(it){ it.col=c; save(); draw(); } }},
        h('h3',null,h('span',null,c),h('span',null,list.length)));
      list.forEach(it=>col.append(h('div',{class:'kc',draggable:'true',ondragstart:()=>{ dragId=it.id; },onclick:()=>edit(it)},h('div',{class:'t'},it.title),
        h('div',{class:'m'},h('span',{class:'tag'},it.type),it.due?h('span',{class:'small mono '+(it.due<td&&c!=='Done'?'bad':'muted')},it.due):null,it.notes?h('span',{class:'small muted'},'✎'):null))));
      col.append(h('button',{class:'btn sm ghost',style:'width:100%',onclick:()=>edit(null,c)},'+')); kb.append(col); }); }
  $('#add').onclick=()=>edit(); draw();
});
</script></body></html>
