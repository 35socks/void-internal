<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette Lab</title><link rel="stylesheet" href="../assets/suite.css">
<style>.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.sw div{cursor:pointer;border:1px solid var(--line)}.sw i{display:block;height:70px}.sw span{display:block;padding:6px 8px;font-family:var(--mono);font-size:10.5px;background:var(--panel)}.prev{padding:18px;border:1px solid var(--line);margin-top:12px}</style></head>
<body data-app="palette"><div id="app"><div id="root"></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const h=SU.h,$=SU.$;
  const hex2rgb=x=>{ x=x.replace('#',''); if(x.length===3) x=x.split('').map(c=>c+c).join(''); const n=parseInt(x,16); return isNaN(n)||x.length!==6?null:[n>>16&255,n>>8&255,n&255]; };
  const rgb2hex=(r,g,b)=>'#'+[r,g,b].map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('');
  const rgb2hsl=(r,g,b)=>{ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let H=0,S=0,L=(mx+mn)/2; if(mx!==mn){ const d=mx-mn; S=L>.5?d/(2-mx-mn):d/(mx+mn); H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; H*=60; } return [H,S*100,L*100]; };
  const hsl2rgb=(H,S,L)=>{ H=((H%360)+360)%360; S/=100; L/=100; const k=n=>(n+H/30)%12, a=S*Math.min(L,1-L), f=n=>L-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1))); return [f(0)*255,f(8)*255,f(4)*255]; };
  const lum=([r,g,b])=>{ const f=c=>{ c/=255; return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4); }; return .2126*f(r)+.7152*f(g)+.0722*f(b); };
  const ratio=(a,b)=>{ const x=lum(a),y=lum(b); return (Math.max(x,y)+.05)/(Math.min(x,y)+.05); };
  const textOn=rgb=>lum(rgb)>.4?'#000':'#fff';
  const grid=cols=>{ const g=h('div',{class:'sw'}); cols.forEach(c=>g.append(h('div',{onclick:()=>SU.copy(c)},h('i',{style:'background:'+c}),h('span',null,c.toUpperCase())))); return g; };
  SU.tabs($('#root'),[
  {label:'From image',render:el=>{
    const out=h('div'), cv=h('canvas',{style:'max-width:100%;max-height:340px;display:none;border:1px solid var(--line);margin-bottom:12px'});
    const inp=h('input',{type:'file',accept:'image/*',hidden:true,onchange:e=>go(e.target.files[0])}), dz=h('label',{class:'drop'},'Drop or choose a photo to extract its palette',inp);
    const kin=h('select',{style:'width:auto',onchange:()=>last&&extract(last)},[5,6,8,10,12].map(n=>h('option',{value:n,selected:n===8},n+' colours')));
    let last=null;
    function medianCut(px,k){ let boxes=[px]; while(boxes.length<k){ boxes.sort((a,b)=>b.length-a.length); const b=boxes.shift(); if(b.length<2){ boxes.push(b); break; } let best=0,bi=0; for(let c=0;c<3;c++){ let mn=255,mx=0; b.forEach(p=>{ mn=Math.min(mn,p[c]); mx=Math.max(mx,p[c]); }); if(mx-mn>best){ best=mx-mn; bi=c; } } b.sort((p,q)=>p[bi]-q[bi]); const m=b.length>>1; boxes.push(b.slice(0,m),b.slice(m)); }
      return boxes.map(b=>{ const s=[0,0,0]; b.forEach(p=>{ s[0]+=p[0]; s[1]+=p[1]; s[2]+=p[2]; }); return {c:s.map(v=>v/b.length),n:b.length}; }).sort((a,b)=>b.n-a.n); }
    function extract(img){ const w=100,hh=Math.max(1,Math.round(100*img.height/img.width)), c=document.createElement('canvas'); c.width=w; c.height=hh; const x=c.getContext('2d'); x.drawImage(img,0,0,w,hh); const d=x.getImageData(0,0,w,hh).data, px=[]; for(let i=0;i<d.length;i+=4) if(d[i+3]>128) px.push([d[i],d[i+1],d[i+2]]);
      const cols=medianCut(px,+kin.value).map(b=>rgb2hex(...b.c)); out.innerHTML=''; out.append(grid(cols),h('div',{class:'row',style:'margin-top:12px'},h('button',{class:'btn sm',onclick:()=>SU.copy(cols.join(', '))},'Copy hex list'),h('button',{class:'btn sm',onclick:()=>SU.copy(':root{\n'+cols.map((c,i)=>'  --c'+(i+1)+': '+c+';').join('\n')+'\n}')},'Copy CSS vars'),h('button',{class:'btn sm',onclick:()=>SU.copy(JSON.stringify(cols))},'Copy JSON'))); }
    function go(f){ if(!f) return; const img=new Image(); img.onload=()=>{ last=img; cv.width=Math.min(img.width,700); cv.height=cv.width*img.height/img.width; cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height); cv.style.display='block'; extract(img); }; img.src=URL.createObjectURL(f); }
    ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ ev.preventDefault(); dz.classList.add('on'); })); ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ ev.preventDefault(); dz.classList.remove('on'); })); dz.addEventListener('drop',ev=>go(ev.dataTransfer.files[0]));
    el.append(h('div',{class:'panel'},dz,h('div',{class:'row',style:'margin:12px 0'},kin),cv,out)); }},
  {label:'Converter',render:el=>{
    const pick=h('input',{type:'color',value:'#8a63ff'}), hx=h('input',{type:'text',value:'#8a63ff',class:'mono'}), o=h('dl',{class:'kv'}), shades=h('div',{style:'margin-top:16px'});
    const run=src=>{ const rgb=hex2rgb(src); if(!rgb) return; const [H,S,L]=rgb2hsl(...rgb), [r,g,b]=rgb; const k=1-Math.max(r,g,b)/255, C=k===1?0:(1-r/255-k)/(1-k), M=k===1?0:(1-g/255-k)/(1-k), Y=k===1?0:(1-b/255-k)/(1-k);
      o.innerHTML='<dt>HEX</dt><dd>'+rgb2hex(r,g,b)+'</dd><dt>RGB</dt><dd>'+r+', '+g+', '+b+'</dd><dt>HSL</dt><dd>'+Math.round(H)+'°, '+Math.round(S)+'%, '+Math.round(L)+'%</dd><dt>CMYK</dt><dd>'+[C,M,Y,k].map(v=>Math.round(v*100)).join(', ')+'</dd><dt>CSS</dt><dd>rgb('+r+' '+g+' '+b+') · hsl('+Math.round(H)+' '+Math.round(S)+'% '+Math.round(L)+'%)</dd>';
      shades.innerHTML=''; shades.append(h('h2',null,'Tints & shades'),grid([90,75,60,45,30,15].map(l=>rgb2hex(...hsl2rgb(H,S,l))))); };
    pick.oninput=()=>{ hx.value=pick.value; run(pick.value); }; hx.oninput=()=>{ if(hex2rgb(hx.value)){ pick.value=rgb2hex(...hex2rgb(hx.value)); run(hx.value); } };
    el.append(h('div',{class:'panel'},h('div',{class:'row'},pick,hx),h('div',{style:'margin-top:16px'},o),shades)); run('#8a63ff'); }},
  {label:'Contrast',render:el=>{
    const a=h('input',{type:'color',value:'#ffffff'}), b=h('input',{type:'color',value:'#000000'}), o=h('div',{style:'margin-top:14px'}), pv=h('div',{class:'prev'});
    const run=()=>{ const A=hex2rgb(a.value),B=hex2rgb(b.value), r=ratio(A,B); const t=(ok,l)=>'<span class="tag '+(ok?'on':'')+'" style="margin-right:6px">'+(ok?'✓ ':'✗ ')+l+'</span>';
      o.innerHTML='<div class="big" style="font-size:36px">'+r.toFixed(2)+':1</div><div style="margin-top:8px">'+t(r>=4.5,'AA text')+t(r>=7,'AAA text')+t(r>=3,'AA large')+t(r>=4.5,'AAA large')+t(r>=3,'UI components')+'</div>';
      pv.style.background=a.value; pv.style.color=b.value; pv.innerHTML='<div style="font-size:22px;font-weight:700">Sample heading</div><div style="font-size:13px;margin-top:6px">The quick brown fox jumps over the lazy dog.</div>'; };
    a.oninput=b.oninput=run; el.append(h('div',{class:'panel'},h('div',{class:'row'},h('label',{class:'f'},h('span',null,'Background'),a),h('label',{class:'f'},h('span',null,'Text'),b),h('button',{class:'btn sm',onclick:()=>{ const t=a.value; a.value=b.value; b.value=t; run(); }},'Swap')),o,pv)); run(); }},
  {label:'Harmonies',render:el=>{
    const base=h('input',{type:'color',value:'#ff5a36'}), out=h('div');
    const run=()=>{ const [H,S,L]=rgb2hsl(...hex2rgb(base.value)); const mk=d=>rgb2hex(...hsl2rgb(H+d,S,L)); const sets=[['Complementary',[0,180]],['Analogous',[-30,0,30]],['Triadic',[0,120,240]],['Split complementary',[0,150,210]],['Tetradic',[0,90,180,270]],['Monochrome',null]];
      out.innerHTML=''; sets.forEach(([n,d])=>out.append(h('h2',{style:'margin-top:16px'},n),grid(d?d.map(mk):[85,70,55,40,25].map(l=>rgb2hex(...hsl2rgb(H,S,l)))))); };
    base.oninput=run; el.append(h('div',{class:'panel'},h('label',{class:'f'},h('span',null,'Base colour'),base),out)); run(); }}
  ]);
});
</script></body></html>
