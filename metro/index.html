<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome</title><link rel="stylesheet" href="../assets/suite.css">
<style>.beats{display:flex;gap:6px;justify-content:center;margin:18px 0;flex-wrap:wrap}.beats b{width:34px;height:34px;border:1px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--dim)}.beats b.acc{border-color:var(--paper);color:var(--paper)}.beats b.now{background:var(--paper);color:var(--void);border-color:var(--paper)}</style></head>
<body data-app="metro"><div id="app"><div class="cols"><div class="panel corners center">
<div class="big" id="bpmD">120</div><div class="small muted">BPM</div>
<input type="range" id="bpm" min="30" max="300" value="120" style="margin:16px 0 6px"><div class="row" style="justify-content:center"><button class="btn sm" data-d="-5">−5</button><button class="btn sm" data-d="-1">−1</button><button class="btn sm" data-d="1">+1</button><button class="btn sm" data-d="5">+5</button></div>
<div class="beats" id="beats"></div><button class="btn primary" id="go" style="padding:14px 44px">Start</button><div class="small muted" style="margin-top:12px">Space to start/stop · click a beat to toggle its accent</div></div>
<div class="panel"><h2>Settings</h2>
<label class="f"><span>Beats per bar</span><input type="number" id="bpb" min="1" max="16" value="4"></label>
<label class="f"><span>Subdivision</span><select id="sub"><option value="1">Quarter notes</option><option value="2">Eighths</option><option value="3">Triplets</option><option value="4">Sixteenths</option></select></label>
<label class="f"><span>Volume</span><input type="range" id="vol" min="0" max="1" step=".05" value=".6"></label>
<label class="f"><span>Click tone</span><select id="tone"><option value="1000">Wood-ish (1 kHz)</option><option value="1500">High</option><option value="700">Low</option></select></label>
<div class="hr"></div><h2>Tempo ramp</h2>
<div class="row"><label class="f grow"><span>Add BPM</span><input type="number" id="rampBy" value="0"></label><label class="f grow"><span>Every N bars</span><input type="number" id="rampEvery" value="4"></label></div>
<label class="f"><span>Max BPM</span><input type="number" id="rampMax" value="200"></label>
<div class="hr"></div><button class="btn" id="tapbtn">Tap tempo</button></div></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$; let ctx=null, run=false, next=0, beat=0, sub=0, bar=0, timer=null, acc=[true];
  const bpm=()=>+$('#bpm').value, bpb=()=>Math.max(1,+$('#bpb').value||4), sd=()=>+$('#sub').value;
  function drawBeats(){ const b=$('#beats'); b.innerHTML=''; while(acc.length<bpb()) acc.push(false); acc.length=bpb(); for(let i=0;i<bpb();i++) b.append(SU.h('b',{class:acc[i]?'acc':'',onclick:()=>{ acc[i]=!acc[i]; drawBeats(); }},i+1)); }
  function click(t,strong,mid){ const o=ctx.createOscillator(), g=ctx.createGain(); o.frequency.value=(+$('#tone').value)*(strong?1.5:mid?1:.8); const v=+$('#vol').value*(strong?1:mid?.7:.4);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.002); g.gain.exponentialRampToValueAtTime(.0001,t+.06); o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t+.07); }
  function schedule(){ while(next<ctx.currentTime+.12){
      click(next, sub===0&&acc[beat], sub===0); const b=beat, s=sub; setTimeout(()=>{ if(!run) return; [...$('#beats').children].forEach((e,i)=>e.classList.toggle('now',i===b&&s===0)); },Math.max(0,(next-ctx.currentTime)*1000));
      next+=60/bpm()/sd(); sub++; if(sub>=sd()){ sub=0; beat++; if(beat>=bpb()){ beat=0; bar++; const by=+$('#rampBy').value, ev=+$('#rampEvery').value; if(by&&ev&&bar%ev===0){ $('#bpm').value=Math.min(+$('#rampMax').value||300,bpm()+by); $('#bpmD').textContent=bpm(); } } } } }
  function start(){ ctx=ctx||new (window.AudioContext||window.webkitAudioContext)(); ctx.resume(); run=true; beat=sub=bar=0; next=ctx.currentTime+.06; timer=setInterval(schedule,25); $('#go').textContent='Stop'; }
  function stop(){ run=false; clearInterval(timer); $('#go').textContent='Start'; [...$('#beats').children].forEach(e=>e.classList.remove('now')); }
  const toggle=()=>run?stop():start();
  $('#go').onclick=toggle; addEventListener('keydown',e=>{ if(e.code==='Space'&&!/INPUT|TEXTAREA|SELECT|BUTTON/.test(e.target.tagName)){ e.preventDefault(); toggle(); } });
  $('#bpm').oninput=()=>$('#bpmD').textContent=bpm();
  SU.$$('[data-d]').forEach(b=>b.onclick=()=>{ $('#bpm').value=bpm()+(+b.dataset.d); $('#bpmD').textContent=bpm(); });
  $('#bpb').oninput=drawBeats; drawBeats();
  let taps=[]; $('#tapbtn').onclick=()=>{ const n=performance.now(); if(taps.length&&n-taps[taps.length-1]>2500) taps=[]; taps.push(n); if(taps.length>1){ const v=(taps[taps.length-1]-taps[0])/(taps.length-1); $('#bpm').value=Math.max(30,Math.min(300,Math.round(60000/v))); $('#bpmD').textContent=bpm(); } };
});
</script></body></html>
