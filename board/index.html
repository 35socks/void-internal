<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moodboard</title><link rel="stylesheet" href="../assets/suite.css">
<style>.mas{column-width:220px;column-gap:10px}.mas figure{break-inside:avoid;margin:0 0 10px;position:relative;border:1px solid var(--line);cursor:zoom-in;background:var(--panel)}.mas img{width:100%;display:block}.mas figcaption{font-size:10.5px;color:var(--dim-3);padding:6px 8px}.lb img{max-width:100%;max-height:60vh;display:block;margin:0 auto 14px}</style></head>
<body data-app="board"><div id="app">
<div class="row" style="margin-bottom:12px"><select id="sel" style="width:auto;min-width:200px"></select><button class="btn sm" id="newb">+ Board</button><button class="btn sm ghost" id="ren">Rename</button><button class="btn sm ghost danger" id="delb">Delete board</button><span style="flex:1"></span><label class="btn primary sm" style="cursor:pointer">+ Add images<input type="file" accept="image/*" multiple hidden id="file"></label></div>
<label class="drop" id="dz" style="margin-bottom:14px">Drop or paste images here · stored locally, downscaled to 1200px</label>
<div class="mas" id="mas"></div><div class="small muted" id="info" style="margin-top:12px"></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$, h=SU.h; let boards=SU.store.get('boards',[]), cur=SU.store.get('board-cur',null); const save=()=>{ SU.store.set('boards',boards); SU.store.set('board-cur',cur); };
  if(!boards.length){ boards.push({id:SU.uid(),name:'First board',items:[]}); cur=boards[0].id; save(); }
  const B=()=>boards.find(b=>b.id===cur)||boards[0];
  const shrink=file=>new Promise((res,rej)=>{ const img=new Image(), u=URL.createObjectURL(file); img.onload=()=>{ const s=Math.min(1,1200/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',.82)); }; img.onerror=()=>rej(); img.src=u; });
  async function add(files){ const b=B(); let n=0; for(const f of files){ if(!/^image\//.test(f.type)) continue; try{ const id=SU.uid(); await SU.idb.set('board:'+id,await shrink(f)); b.items.push({id,note:f.name.replace(/\.[^.]+$/,'')}); n++; }catch{} } save(); draw(); SU.toast(n+' added'); }
  async function draw(){
    const s=$('#sel'); s.innerHTML=''; boards.forEach(b=>s.append(h('option',{value:b.id,selected:b.id===cur},b.name+' ('+b.items.length+')')));
    const m=$('#mas'); m.innerHTML=''; const b=B();
    for(const it of b.items){ const uri=await SU.idb.get('board:'+it.id); if(!uri) continue;
      m.append(h('figure',{onclick:()=>open(it,uri)},h('img',{src:uri,loading:'lazy'}),it.note?h('figcaption',null,it.note):null)); }
    $('#info').textContent=b.items.length?b.items.length+' images on this board':'Empty board — add or paste some references.';
  }
  async function open(it,uri){
    const note=h('input',{type:'text',value:it.note||'',placeholder:'Caption / notes'});
    const r=await SU.modal(null,h('div',{class:'lb'},h('img',{src:uri}),note),[{label:'Remove',cls:'danger ghost',value:'del'},{label:'Download',cls:'ghost',value:'dl'},{label:'Close',cls:'ghost',value:null},{label:'Save',cls:'primary',value:'save'}]);
    if(r==='save'){ it.note=note.value; save(); draw(); } else if(r==='del'){ const b=B(); b.items=b.items.filter(x=>x!==it); await SU.idb.del('board:'+it.id); save(); draw(); } else if(r==='dl'){ const a=h('a',{href:uri,download:(it.note||'image')+'.jpg'}); document.body.append(a); a.click(); a.remove(); }
  }
  $('#sel').onchange=()=>{ cur=$('#sel').value; save(); draw(); };
  $('#newb').onclick=async()=>{ const n=await SU.prompt('Board name'); if(n&&n.trim()){ const b={id:SU.uid(),name:n.trim(),items:[]}; boards.push(b); cur=b.id; save(); draw(); } };
  $('#ren').onclick=async()=>{ const n=await SU.prompt('Rename board',B().name); if(n&&n.trim()){ B().name=n.trim(); save(); draw(); } };
  $('#delb').onclick=async()=>{ if(boards.length<2){ SU.toast('Keep at least one board'); return; } if(await SU.confirm('Delete this board and its images?')){ for(const it of B().items) await SU.idb.del('board:'+it.id); boards=boards.filter(b=>b!==B()); cur=boards[0].id; save(); draw(); } };
  $('#file').onchange=e=>add([...e.target.files]);
  const dz=$('#dz'); ['dragenter','dragover'].forEach(e=>dz.addEventListener(e,ev=>{ ev.preventDefault(); dz.classList.add('on'); })); ['dragleave','drop'].forEach(e=>dz.addEventListener(e,ev=>{ ev.preventDefault(); dz.classList.remove('on'); }));
  dz.addEventListener('drop',ev=>add([...ev.dataTransfer.files])); addEventListener('dragover',e=>e.preventDefault()); addEventListener('drop',e=>{ e.preventDefault(); if(e.target!==dz&&e.dataTransfer.files.length) add([...e.dataTransfer.files]); });
  addEventListener('paste',e=>{ const fs=[...(e.clipboardData?e.clipboardData.files:[])]; if(fs.length) add(fs); });
  draw();
});
</script></body></html>
