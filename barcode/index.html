<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barcode Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0c0b; --panel:#111513; --panel2:#161b18; --line:#232a26;
    --text:#e6ece8; --muted:#8a968f; --accent:#4ade80; --accent-ink:#04140a; --err:#f87171;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"JetBrains Mono",ui-monospace,Menlo,monospace;font-size:14px}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 48px}
  header{display:flex;align-items:baseline;gap:14px;margin-bottom:22px;flex-wrap:wrap}
  h1{font-size:20px;margin:0;letter-spacing:.02em}
  h1 span{color:var(--accent)}
  header p{margin:0;color:var(--muted);font-size:12px}
  .grid{display:grid;grid-template-columns:340px 1fr;gap:18px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
  label.f{display:block;margin-bottom:14px}
  label.f > span{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  label.f > span b{color:var(--text);font-weight:600;text-transform:none;letter-spacing:0}
  input[type=text],select,textarea{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:10px 11px;font:inherit;outline:none}
  input[type=text]:focus,select:focus{border-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row > *{flex:1}
  .colors{display:flex;gap:10px;align-items:center}
  .swatch{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 8px;flex:1;font-size:12px;color:var(--muted)}
  .swatch input{width:26px;height:26px;border:none;padding:0;background:none;cursor:pointer}
  .check{display:flex;align-items:center;gap:8px;color:var(--text);font-size:13px;margin:4px 0 12px;cursor:pointer;user-select:none}
  .check input{accent-color:var(--accent);width:16px;height:16px}
  .hint{color:var(--muted);font-size:11.5px;margin-top:6px;line-height:1.5}
  .msg{min-height:18px;font-size:12px;margin-top:6px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--accent)}
  .preview{display:flex;align-items:center;justify-content:center;min-height:320px;border-radius:8px;border:1px solid var(--line);padding:24px;overflow:auto;
    background-color:#1a1f1c;background-image:linear-gradient(45deg,#222824 25%,transparent 25%),linear-gradient(-45deg,#222824 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#222824 75%),linear-gradient(-45deg,transparent 75%,#222824 75%);
    background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
  .preview img{max-width:100%;height:auto;image-rendering:pixelated;display:block}
  .preview .empty{color:var(--muted)}
  .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin:12px 2px 14px;flex-wrap:wrap;gap:8px}
  .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .actions input{flex:1;min-width:180px}
  button{font:inherit;border-radius:7px;padding:10px 16px;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text)}
  button:hover{border-color:#3a443e}
  button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
  button.primary:hover{filter:brightness(1.08)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:8px;font-size:13px;transition:.2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .sect{border-top:1px solid var(--line);margin:16px -18px 14px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BARCODE<span>_</span>MAKER</h1>
    <p>Code 128 · EAN-13 · UPC-A · EAN-8 · Code 39 → PNG</p>
  </header>

  <div class="grid">
    <div class="card">
      <label class="f"><span>Format</span>
        <select id="type">
          <option value="code128">Code 128 (any text)</option>
          <option value="ean13">EAN-13 (retail, 12–13 digits)</option>
          <option value="upca">UPC-A (retail, 11–12 digits)</option>
          <option value="ean8">EAN-8 (7–8 digits)</option>
          <option value="code39">Code 39 (A–Z, 0–9, - . $ / + % space)</option>
        </select>
      </label>
      <label class="f"><span>Data</span>
        <input type="text" id="data" value="ABC-12345" spellcheck="false" autocomplete="off">
        <div class="msg" id="msg"></div>
        <div class="hint" id="hint"></div>
      </label>

      <div class="sect"></div>

      <label class="f"><span>Bar width <b id="scaleV"></b></span>
        <input type="range" id="scale" min="1" max="10" value="3"></label>
      <label class="f"><span>Bar height <b id="heightV"></b></span>
        <input type="range" id="height" min="20" max="400" step="5" value="120"></label>
      <label class="f"><span>Quiet zone <b id="quietV"></b></span>
        <input type="range" id="quiet" min="0" max="30" value="10"></label>

      <label class="check"><input type="checkbox" id="showText" checked> Show human-readable text</label>
      <label class="f" id="textSizeWrap"><span>Text size <b id="textSizeV"></b></span>
        <input type="range" id="textSize" min="4" max="20" value="9"></label>

      <div class="sect"></div>

      <div class="colors">
        <label class="swatch"><input type="color" id="fg" value="#000000"> Bars</label>
        <label class="swatch"><input type="color" id="bg" value="#ffffff"> Background</label>
      </div>
      <label class="check" style="margin-top:12px"><input type="checkbox" id="transparent"> Transparent background</label>
    </div>

    <div class="card">
      <div class="preview" id="preview"><span class="empty">Preview</span></div>
      <div class="meta"><span id="dims">—</span><span id="enc">—</span></div>
      <div class="actions">
        <input type="text" id="filename" spellcheck="false" autocomplete="off" placeholder="filename.png">
        <button id="copyBtn">Copy image</button>
        <button id="dlBtn" class="primary">Download PNG</button>
      </div>
      <div class="hint" id="dlHint"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
"use strict";

/* ---------- Code 128 ---------- */
const C128 = ["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213",
"221312","231212","112232","122132","122231","113222","123122","123221","223211","221132",
"221231","213212","223112","312131","311222","321122","321221","312212","322112","322211",
"212123","212321","232121","111323","131123","131321","112313","132113","132311","211313",
"231113","231311","112133","112331","132131","113123","113321","133121","313121","211331",
"231131","213113","213311","213131","311123","311321","331121","312113","312311","332111",
"314111","221411","431111","111224","111422","121124","121421","141122","141221","112214",
"112412","122114","122411","142112","142211","241211","221114","413111","241112","134111",
"111242","121142","121241","114212","124112","124211","411212","421112","421211","212141",
"214121","412121","111143","111341","131141","114113","114311","411113","411311","113141",
"114131","311141","411131","211412","211214","211232","2331112"];

function widthsToModules(widths, out, guard=false){
  let bar = true;
  for (const w of widths){
    for (let k=0;k<+w;k++) out.push({b: bar?1:0, g: guard});
    bar = !bar;
  }
}

function encode128(s){
  if (!s.length) throw new Error("Enter some text to encode.");
  const vals = []; let set = null;
  const isD = c => c >= "0" && c <= "9";
  const runAt = i => { let j=i; while (j<s.length && isD(s[j])) j++; return j-i; };
  const sw = to => {
    if (set === null) vals.push({A:103,B:104,C:105}[to]);
    else if (set !== to) vals.push({A:101,B:100,C:99}[to]);
    set = to;
  };
  const ab = ch => {
    const c = ch.charCodeAt(0);
    if (c > 127) throw new Error(`"${ch}" isn't ASCII — Code 128 can't encode it.`);
    if (c < 32){ sw("A"); vals.push(c+64); }
    else if (c >= 96){ sw("B"); vals.push(c-32); }
    else { if (set !== "A") sw("B"); vals.push(c-32); }
  };
  let i = 0;
  while (i < s.length){
    const r = runAt(i), rest = s.length - i;
    const wantC = r >= 4 || (r === rest && r >= 2 && (set === "C" || set === null));
    if (wantC){
      if (r % 2 === 1){ ab(s[i]); i++; continue; }
      sw("C");
      for (let k=0;k<r;k+=2) vals.push(+s.substr(i+k,2));
      i += r; continue;
    }
    ab(s[i]); i++;
  }
  let sum = vals[0];
  for (let k=1;k<vals.length;k++) sum += vals[k]*k;
  vals.push(sum % 103); vals.push(106);
  const mods = [];
  vals.forEach(v => widthsToModules(C128[v], mods));
  const label = s.replace(/[\x00-\x1f\x7f]/g, "·");
  return { mods, texts:[{t:label, x: mods.length/2}], center:true,
           info: `${vals.length} symbols · ${mods.length} modules` };
}

/* ---------- EAN / UPC ---------- */
const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_R = EAN_L.map(p => p.replace(/./g, c => c==="0"?"1":"0"));
const EAN_G = EAN_R.map(p => [...p].reverse().join(""));
const PARITY = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];

function checkDigit(d){
  let sum = 0; const n = d.length;
  for (let i=0;i<n;i++) sum += (+d[i]) * (((n-i)%2===1) ? 3 : 1);
  return (10 - sum%10) % 10;
}
function digitsWithCheck(raw, n, name){
  const s = raw.replace(/[\s-]/g, "");
  if (!/^\d*$/.test(s)) throw new Error(`${name} takes digits only.`);
  if (s.length === n-1) return { d: s + checkDigit(s), added: true };
  if (s.length === n){
    const c = checkDigit(s.slice(0,-1));
    if (+s[n-1] !== c) throw new Error(`Check digit is wrong — should be ${c} (or enter ${n-1} digits and it's added for you).`);
    return { d: s, added: false };
  }
  throw new Error(`${name} needs ${n-1} digits (check digit added) or ${n} digits.`);
}
function pushBits(bits, out, guard=false){ for (const c of bits) out.push({b:+c, g:guard}); }

function encodeEAN13(raw, upc=false){
  let d, added;
  if (upc){ const r = digitsWithCheck(raw, 12, "UPC-A"); d = "0" + r.d; added = r.added; }
  else { const r = digitsWithCheck(raw, 13, "EAN-13"); d = r.d; added = r.added; }
  const mods = [];
  pushBits("101", mods, true);
  const par = PARITY[+d[0]];
  for (let k=0;k<6;k++){
    const dig = +d[k+1];
    pushBits(par[k]==="L" ? EAN_L[dig] : EAN_G[dig], mods, upc && k===0);
  }
  pushBits("01010", mods, true);
  for (let k=0;k<6;k++) pushBits(EAN_R[+d[k+7]], mods, upc && k===5);
  pushBits("101", mods, true);
  const texts = [];
  if (!upc){
    texts.push({t:d[0], x:-4.5, side:"L"});
    for (let k=0;k<6;k++) texts.push({t:d[k+1], x:3+7*k+3.5});
    for (let k=0;k<6;k++) texts.push({t:d[k+7], x:50+7*k+3.5});
  } else {
    const u = d.slice(1);
    texts.push({t:u[0], x:-4.5, small:true, side:"L"});
    for (let k=1;k<6;k++) texts.push({t:u[k], x:3+7*k+3.5});
    for (let k=0;k<5;k++) texts.push({t:u[k+6], x:50+7*k+3.5});
    texts.push({t:u[11], x:95+4.5, small:true, side:"R"});
  }
  return { mods, texts, ean:true, info: (upc ? "UPC-A " + d.slice(1) : "EAN-13 " + d) + (added ? " · check digit added" : "") };
}

function encodeEAN8(raw){
  const { d, added } = digitsWithCheck(raw, 8, "EAN-8");
  const mods = [];
  pushBits("101", mods, true);
  for (let k=0;k<4;k++) pushBits(EAN_L[+d[k]], mods);
  pushBits("01010", mods, true);
  for (let k=0;k<4;k++) pushBits(EAN_R[+d[k+4]], mods);
  pushBits("101", mods, true);
  const texts = [];
  for (let k=0;k<4;k++) texts.push({t:d[k], x:3+7*k+3.5});
  for (let k=0;k<4;k++) texts.push({t:d[k+4], x:36+7*k+3.5});
  return { mods, texts, ean:true, info: "EAN-8 " + d + (added ? " · check digit added" : "") };
}

/* ---------- Code 39 ---------- */
const C39 = {"0":"000110100","1":"100100001","2":"001100001","3":"101100000","4":"000110001","5":"100110000","6":"001110000","7":"000100101","8":"100100100","9":"001100100",
"A":"100001001","B":"001001001","C":"101001000","D":"000011001","E":"100011000","F":"001011000","G":"000001101","H":"100001100","I":"001001100","J":"000011100",
"K":"100000011","L":"001000011","M":"101000010","N":"000010011","O":"100010010","P":"001010010","Q":"000000111","R":"100000110","S":"001000110","T":"000010110",
"U":"110000001","V":"011000001","W":"111000000","X":"010010001","Y":"110010000","Z":"011010000","-":"010000101",".":"110000100"," ":"011000100","*":"010010100",
"$":"010101000","/":"010100010","+":"010001010","%":"000101010"};
function encode39(raw){
  const s = raw.toUpperCase();
  if (!s.length) throw new Error("Enter some text to encode.");
  for (const ch of s) if (!(ch in C39) || ch === "*") throw new Error(`"${ch}" isn't allowed in Code 39.`);
  const full = "*" + s + "*"; const mods = [];
  [...full].forEach((ch, idx) => {
    const w = [...C39[ch]].map(x => x === "1" ? "3" : "1").join("");
    widthsToModules(w, mods);
    if (idx < full.length-1) mods.push({b:0, g:false});
  });
  return { mods, texts:[{t:s, x:mods.length/2}], center:true, info: `${s.length} chars · ${mods.length} modules` };
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
const el = { type:$("type"), data:$("data"), msg:$("msg"), hint:$("hint"), scale:$("scale"), height:$("height"), quiet:$("quiet"),
  showText:$("showText"), textSize:$("textSize"), textSizeWrap:$("textSizeWrap"), fg:$("fg"), bg:$("bg"), transparent:$("transparent"),
  scaleV:$("scaleV"), heightV:$("heightV"), quietV:$("quietV"), textSizeV:$("textSizeV"),
  preview:$("preview"), dims:$("dims"), enc:$("enc"), filename:$("filename"), dlBtn:$("dlBtn"), copyBtn:$("copyBtn"), dlHint:$("dlHint") };

const HINTS = {
  code128:"Any ASCII text — product codes, URLs, IDs. Digit runs are packed automatically for a shorter barcode.",
  ean13:"12 digits → the 13th (check digit) is calculated. Or paste all 13 to validate.",
  upca:"11 digits → the 12th (check digit) is calculated. Or paste all 12 to validate.",
  ean8:"7 digits → the 8th (check digit) is calculated.",
  code39:"Letters are uppercased automatically. Allowed: A–Z 0–9 - . $ / + % and space."
};
const DEFAULTS = { code128:"ABC-12345", ean13:"501234567890", upca:"03600029145", ean8:"9638507", code39:"CODE-39" };

let filenameTouched = false;
let lastCanvas = null, lastBlobURL = null;

function encode(){
  const v = el.data.value;
  switch (el.type.value){
    case "code128": return encode128(v);
    case "ean13": return encodeEAN13(v);
    case "upca": return encodeEAN13(v, true);
    case "ean8": return encodeEAN8(v);
    case "code39": return encode39(v);
  }
}

function render(){
  const scale = +el.scale.value, H = +el.height.value, showText = el.showText.checked;
  const fs = Math.max(8, Math.round(scale * +el.textSize.value * 0.75));
  el.scaleV.textContent = scale + " px"; el.heightV.textContent = H + " px";
  el.quietV.textContent = el.quiet.value + " modules"; el.textSizeV.textContent = fs + " px";
  el.textSizeWrap.style.display = showText ? "" : "none";
  el.bg.disabled = el.transparent.checked;
  el.bg.parentElement.style.opacity = el.transparent.checked ? .4 : 1;

  let r;
  try { r = encode(); el.msg.textContent = ""; el.msg.className = "msg"; }
  catch (e){
    el.msg.textContent = e.message; el.msg.className = "msg err";
    el.preview.innerHTML = '<span class="empty">Fix the data to see a barcode</span>';
    el.dims.textContent = "—"; el.enc.textContent = "—"; lastCanvas = null; setBtns(); return;
  }

  let qL = +el.quiet.value, qR = qL;
  if (r.ean && showText){
    if (r.texts.some(t => t.side === "L")) qL = Math.max(qL, 9);
    if (r.texts.some(t => t.side === "R")) qR = Math.max(qR, 9);
  }
  const padY = Math.max(Math.round(scale * Math.min(+el.quiet.value, 10) * 0.6), 0);
  const textBlock = showText ? Math.round(fs * (r.ean ? 1.05 : 1.25)) : 0;
  const W = (r.mods.length + qL + qR) * scale;
  const Ht = padY*2 + H + textBlock;

  const cv = document.createElement("canvas");
  cv.width = W; cv.height = Ht;
  const ctx = cv.getContext("2d");
  if (!el.transparent.checked){ ctx.fillStyle = el.bg.value; ctx.fillRect(0,0,W,Ht); }
  ctx.fillStyle = el.fg.value;

  const guardExtra = (r.ean && showText) ? Math.round(fs*0.55) : 0;
  let i = 0;
  while (i < r.mods.length){
    if (!r.mods[i].b){ i++; continue; }
    let j = i; while (j < r.mods.length && r.mods[j].b && r.mods[j].g === r.mods[i].g) j++;
    const h = H + (r.mods[i].g ? guardExtra : 0);
    ctx.fillRect((qL+i)*scale, padY, (j-i)*scale, h);
    i = j;
  }

  if (showText){
    ctx.textAlign = "center"; ctx.textBaseline = "top";
    for (const t of r.texts){
      const size = t.small ? Math.round(fs*0.8) : fs;
      ctx.font = `600 ${size}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
      const y = padY + H + (r.ean ? Math.round(fs*0.08) : Math.round(fs*0.2));
      let txt = t.t;
      if (r.center){
        const maxW = W - 4;
        while (txt.length > 1 && ctx.measureText(txt).width > maxW) txt = txt.slice(0,-2) + "…";
      }
      ctx.fillText(txt, (qL + t.x) * scale, y);
    }
  }

  lastCanvas = cv;
  if (lastBlobURL) URL.revokeObjectURL(lastBlobURL);
  const url = cv.toDataURL("image/png");
  const img = new Image(); img.src = url; img.alt = "Barcode preview";
  img.style.width = (W > 900 ? "100%" : W + "px");
  el.preview.innerHTML = ""; el.preview.appendChild(img);
  el.dims.textContent = `${W} × ${Ht} px`;
  el.enc.textContent = r.info;
  if (!filenameTouched) el.filename.value = suggestName();
  setBtns();
}

function suggestName(){
  const base = (el.data.value.trim() || "barcode").replace(/[^\w.-]+/g, "_").slice(0, 60);
  return `${el.type.value}_${base}.png`;
}
function cleanName(){
  let n = el.filename.value.trim() || suggestName();
  if (!/\.png$/i.test(n)) n += ".png";
  return n;
}
function setBtns(){ el.dlBtn.disabled = !lastCanvas; el.copyBtn.disabled = !lastCanvas; }
function toast(t){ const x=$("toast"); x.textContent=t; x.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>x.classList.remove("show"),2200); }
const getBlob = () => new Promise(res => lastCanvas.toBlob(res, "image/png"));

/* downloads: platform capability when hosted, plain link otherwise */
let downloads = null, hosted = !!(window.claude && typeof window.claude.use === "function");
if (hosted){
  window.claude.use("downloads").then(d => {
    downloads = d;
    if (!d) el.dlHint.textContent = "Downloads aren't available in this view — right-click (or long-press) the preview and choose “Save image”.";
  }).catch(() => {});
}

el.dlBtn.addEventListener("click", async () => {
  if (!lastCanvas) return;
  const blob = await getBlob(); const name = cleanName();
  if (downloads){
    try { await downloads.save({ filename: name, data: blob }); toast("Saved " + name); }
    catch (e){
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") { toast("One moment — a save prompt is already open."); return; }
      toast("Couldn't save — right-click the preview to save it instead.");
    }
    return;
  }
  if (hosted){ toast("Right-click (or long-press) the preview → Save image"); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
});

el.copyBtn.addEventListener("click", async () => {
  if (!lastCanvas) return;
  try {
    const blob = await getBlob();
    await navigator.clipboard.write([new ClipboardItem({"image/png": blob})]);
    toast("Image copied to clipboard");
  } catch { toast("Copy isn't allowed here — use Download instead."); }
});

el.type.addEventListener("change", () => {
  el.data.value = DEFAULTS[el.type.value];
  el.hint.textContent = HINTS[el.type.value];
  render();
});
el.filename.addEventListener("input", () => { filenameTouched = el.filename.value.trim() !== ""; });
["data","scale","height","quiet","textSize","fg","bg"].forEach(k => el[k].addEventListener("input", render));
["showText","transparent"].forEach(k => el[k].addEventListener("change", render));

el.hint.textContent = HINTS.code128;
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
})();
</script>
