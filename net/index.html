<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Network Calc</title><link rel="stylesheet" href="../assets/suite.css"></head>
<body data-app="net"><div id="app"><div id="root"></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const h=SU.h,$=SU.$;
  const ip2n=s=>{ const p=s.trim().split('.'); if(p.length!==4||p.some(x=>!/^\d+$/.test(x)||+x>255)) return null; return (((+p[0]<<24)|(+p[1]<<16)|(+p[2]<<8)|+p[3])>>>0); };
  const n2ip=n=>[n>>>24,n>>>16&255,n>>>8&255,n&255].join('.');
  const mask=c=>c===0?0:(0xFFFFFFFF<<(32-c))>>>0;
  const bin=n=>n2ip(n).split('.').map(x=>(+x).toString(2).padStart(8,'0')).join('.');
  function parse(t){ const m=t.trim().match(/^(\d+\.\d+\.\d+\.\d+)(?:\/(\d+)|\s+(\d+\.\d+\.\d+\.\d+))?$/); if(!m) return null; const ip=ip2n(m[1]); if(ip==null) return null; let c=32; if(m[2]!==undefined) c=+m[2]; else if(m[3]){ const mk=ip2n(m[3]); if(mk==null) return null; c=mk.toString(2).replace(/0+$/,'').length; if(mask(c)!==mk) return null; } if(c>32) return null; return {ip,c}; }
  function info(ip,c){ const mk=mask(c), net=(ip&mk)>>>0, bc=(net|~mk)>>>0, hosts=c>=31?(c===32?1:2):Math.pow(2,32-c)-2; return {mk,net,bc,hosts,first:c>=31?net:net+1,last:c>=31?bc:bc-1}; }
  const priv=n=>{ const a=n>>>24,b=n>>>16&255; return a===10||(a===172&&b>=16&&b<=31)||(a===192&&b===168)?'Private (RFC 1918)':a===127?'Loopback':a===169&&b===254?'Link-local':a>=224&&a<=239?'Multicast':a===100&&b>=64&&b<=127?'CGNAT (100.64/10)':'Public'; };
  const PORTS=[[20,'FTP data'],[21,'FTP'],[22,'SSH / SFTP'],[23,'Telnet'],[25,'SMTP'],[53,'DNS'],[67,'DHCP server'],[80,'HTTP'],[88,'Kerberos'],[110,'POP3'],[111,'NFS portmap'],[123,'NTP'],[137,'NetBIOS'],[139,'SMB (NetBIOS)'],[143,'IMAP'],[161,'SNMP'],[389,'LDAP'],[443,'HTTPS'],[445,'SMB'],[465,'SMTPS'],[514,'Syslog'],[587,'SMTP submission'],[636,'LDAPS'],[853,'DNS over TLS'],[873,'rsync'],[993,'IMAPS'],[1194,'OpenVPN'],[1433,'MS SQL'],[1883,'MQTT'],[1900,'SSDP / UPnP'],[2049,'NFS'],[2375,'Docker (unencrypted)'],[2376,'Docker TLS'],[3000,'Grafana / dev servers'],[3306,'MySQL / MariaDB'],[3389,'RDP'],[5000,'Synology DSM / Flask'],[5001,'Synology DSM HTTPS'],[5201,'iperf3'],[5353,'mDNS'],[5432,'PostgreSQL'],[5900,'VNC'],[6379,'Redis'],[6443,'Kubernetes API'],[7878,'Radarr'],[8000,'Dev / Portainer agent'],[8006,'Proxmox VE'],[8080,'Alt HTTP'],[8096,'Jellyfin'],[8123,'Home Assistant'],[8384,'Syncthing UI'],[8443,'Alt HTTPS / UniFi'],[8686,'Lidarr'],[8920,'Jellyfin HTTPS'],[8989,'Sonarr'],[9000,'Portainer'],[9090,'Prometheus'],[9091,'Transmission'],[9117,'Jackett'],[9696,'Prowlarr'],[9100,'Node exporter'],[19999,'Netdata'],[32400,'Plex'],[51820,'WireGuard']];
  SU.tabs($('#root'),[
  {label:'Subnet',render:el=>{
    const inp=h('input',{type:'text',value:'192.168.1.37/24',class:'mono',placeholder:'192.168.1.0/24 or 10.0.0.1 255.255.255.0'}), o=h('dl',{class:'kv'}), bits=h('div',{class:'mono small muted',style:'margin-top:14px;word-break:break-all'});
    const run=()=>{ const p=parse(inp.value); if(!p){ o.innerHTML='<dt>Error</dt><dd>Enter IPv4 as a.b.c.d/nn or a.b.c.d mask</dd>'; bits.textContent=''; return; } const i=info(p.ip,p.c);
      o.innerHTML='<dt>Address</dt><dd>'+n2ip(p.ip)+' · '+priv(p.ip)+'</dd><dt>Network</dt><dd>'+n2ip(i.net)+'/'+p.c+'</dd><dt>Netmask</dt><dd>'+n2ip(i.mk)+'</dd><dt>Wildcard</dt><dd>'+n2ip(~i.mk>>>0)+'</dd><dt>Broadcast</dt><dd>'+n2ip(i.bc)+'</dd><dt>Host range</dt><dd>'+n2ip(i.first)+' – '+n2ip(i.last)+'</dd><dt>Usable hosts</dt><dd>'+i.hosts.toLocaleString()+'</dd><dt>Total addresses</dt><dd>'+Math.pow(2,32-p.c).toLocaleString()+'</dd>';
      bits.innerHTML='IP &nbsp;&nbsp;&nbsp;'+bin(p.ip)+'<br>Mask '+bin(i.mk)+'<br>Net &nbsp;&nbsp;'+bin(i.net); };
    inp.oninput=run; el.append(h('div',{class:'panel'},h('label',{class:'f'},h('span',null,'IPv4 address / prefix'),inp),o,bits)); run(); }},
  {label:'Split & check',render:el=>{
    const inp=h('input',{type:'text',value:'10.0.0.0/16',class:'mono'}), to=h('input',{type:'number',value:24,min:1,max:32,style:'width:100px'}), o=h('div',{class:'tablewrap',style:'margin-top:12px'}), sum=h('div',{class:'small muted',style:'margin-top:8px'});
    const run=()=>{ const p=parse(inp.value), n=+to.value; o.innerHTML=''; if(!p||n<=p.c||n>32){ sum.textContent=!p?'Invalid network':'Target prefix must be longer than /'+(p?p.c:'?'); return; } const base=info(p.ip,p.c).net, cnt=Math.pow(2,n-p.c), step=Math.pow(2,32-n); const max=Math.min(cnt,256);
      let t='<table><thead><tr><th>#</th><th>Network</th><th>Range</th><th>Broadcast</th></tr></thead><tbody>'; for(let i=0;i<max;i++){ const net=(base+i*step)>>>0, inf=info(net,n); t+='<tr><td class="muted">'+(i+1)+'</td><td class="mono">'+n2ip(net)+'/'+n+'</td><td class="mono">'+n2ip(inf.first)+' – '+n2ip(inf.last)+'</td><td class="mono">'+n2ip(inf.bc)+'</td></tr>'; } o.innerHTML=t+'</tbody></table>'; sum.textContent=cnt.toLocaleString()+' × /'+n+' subnets, '+info(base,n).hosts.toLocaleString()+' usable hosts each'+(cnt>256?' (showing first 256)':''); };
    const ck=h('input',{type:'text',value:'192.168.1.200',class:'mono'}), cn=h('input',{type:'text',value:'192.168.1.0/24',class:'mono'}), cr=h('div',{class:'small',style:'margin-top:8px'});
    const chk=()=>{ const a=ip2n(ck.value), p=parse(cn.value); if(a==null||!p){ cr.textContent='Enter a valid IP and network'; return; } const i=info(p.ip,p.c), inn=a>=i.net&&a<=i.bc; cr.innerHTML=inn?'<span class="ok">✓ '+n2ip(a)+' is inside '+n2ip(i.net)+'/'+p.c+'</span>':'<span class="bad">✗ outside '+n2ip(i.net)+'/'+p.c+'</span>'; };
    inp.oninput=to.oninput=run; ck.oninput=cn.oninput=chk;
    el.append(h('div',{class:'panel'},h('h2',null,'Split a network'),h('div',{class:'row'},h('label',{class:'f grow'},h('span',null,'Network'),inp),h('label',{class:'f'},h('span',null,'into /'),to)),sum,o),h('div',{class:'panel'},h('h2',null,'Is this IP in that network?'),h('div',{class:'row'},h('label',{class:'f grow'},h('span',null,'IP'),ck),h('label',{class:'f grow'},h('span',null,'Network'),cn)),cr)); run(); chk(); }},
  {label:'Ports',render:el=>{
    const q=h('input',{type:'search',placeholder:'Search port or service…'}), o=h('div',{class:'tablewrap',style:'margin-top:12px'});
    const run=()=>{ const s=q.value.toLowerCase(); const r=PORTS.filter(([p,n])=>!s||String(p).includes(s)||n.toLowerCase().includes(s)); o.innerHTML='<table><thead><tr><th class="num">Port</th><th>Service</th></tr></thead><tbody>'+r.map(([p,n])=>'<tr><td class="num">'+p+'</td><td>'+SU.esc(n)+'</td></tr>').join('')+'</tbody></table>'; };
    q.oninput=run; el.append(h('div',{class:'panel'},q,o)); run(); }}
  ]);
});
</script></body></html>
