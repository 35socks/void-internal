<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Config Forge</title><link rel="stylesheet" href="../assets/suite.css"></head>
<body data-app="forge"><div id="app"><div id="root"></div></div>

<script>

  {label:'Cron',render:el=>{

  {label:'chmod',render:el=>{

  {label:'Compose',render:el=>{

  {label:'nginx',render:el=>{

  {label:'rsync / ssh',render:el=>{
