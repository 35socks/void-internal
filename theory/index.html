<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Key &amp; Chords</title><link rel="stylesheet" href="../assets/suite.css">
<style>.pk{display:flex;gap:2px;margin-top:12px}.pk i{flex:1;height:70px;border:1px solid var(--line-2);display:flex;align-items:flex-end;justify-content:center;font-size:9px;font-style:normal;padding-bottom:4px;color:var(--dim)}.pk i.b{background:#1a1a1a;height:46px}.pk i.on{background:var(--paper);color:var(--void)}.cam{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}.cam div{border:1px solid var(--line);padding:8px 2px;text-align:center;font-family:var(--mono);font-size:11px}.cam div.on{background:var(--paper);color:var(--void)}.cam div.nb{border-color:var(--dim-3);color:var(--paper)}</style></head>
<body data-app="theory"><div id="app"><div class="cols">
<div class="panel"><h2>Scale &amp; chords</h2><div class="row"><label class="f grow"><span>Root</span><select id="root"></select></label><label class="f grow"><span>Scale</span><select id="scale"></select></label></div>
<div id="notes" class="chips" style="margin-bottom:6px"></div><div class="pk" id="pk"></div><div class="hr"></div><h2>Diatonic chords</h2><div class="tablewrap"><table id="chords"></table></div></div>
<div class="panel"><h2>Camelot wheel</h2><div class="small muted" style="margin-bottom:10px">Compatible keys for harmonic mixing: same, ±1, and relative major/minor.</div>
<div class="row"><label class="f grow"><span>Key</span><select id="ckey"></select></label></div><div id="cam"></div><div class="hr"></div>
<h2>Transposer</h2><div class="row"><label class="f grow"><span>Chords (space separated)</span><input type="text" id="tin" value="Am F C G"></label><label class="f" style="width:100px"><span>Semitones</span><input type="number" id="tby" value="2"></label></div><div class="out" id="tout"></div>
<div class="hr"></div><h2>Capo</h2><div class="small muted" id="capo"></div></div></div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$, N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'], FL={'Db':1,'Eb':3,'Gb':6,'Ab':8,'Bb':10};
  const SC={Major:[0,2,4,5,7,9,11],'Natural minor':[0,2,3,5,7,8,10],'Harmonic minor':[0,2,3,5,7,8,11],'Melodic minor':[0,2,3,5,7,9,11],Dorian:[0,2,3,5,7,9,10],Phrygian:[0,1,3,5,7,8,10],Lydian:[0,2,4,6,7,9,11],Mixolydian:[0,2,4,5,7,9,10],Locrian:[0,1,3,5,6,8,10],'Major pentatonic':[0,2,4,7,9],'Minor pentatonic':[0,3,5,7,10],Blues:[0,3,5,6,7,10]};
  N.forEach(n=>$('#root').append(SU.h('option',{value:n},n))); Object.keys(SC).forEach(s=>$('#scale').append(SU.h('option',null,s)));
  function draw(){
    const r=N.indexOf($('#root').value), sc=SC[$('#scale').value], set=sc.map(i=>(r+i)%12);
    $('#notes').innerHTML=set.map((n,i)=>'<span class="tag '+(i?'':'on')+'">'+N[n]+'</span>').join('');
    const pk=$('#pk'); pk.innerHTML=''; for(let o=0;o<24;o++){ const n=o%12, black=[1,3,6,8,10].includes(n); pk.append(SU.h('i',{class:(black?'b ':'')+(set.includes(n)?'on':'')},N[n].replace('#','♯'))); }
    if(sc.length===7){
      const q=[[0,4,7,'','maj'],[0,3,7,'m','min'],[0,3,6,'°','dim'],[0,4,8,'+','aug']]; const rn=['I','II','III','IV','V','VI','VII'];
      let h='<thead><tr><th>#</th><th>Chord</th><th>7th</th><th>Notes</th></tr></thead><tbody>';
      sc.forEach((_,i)=>{ const a=sc[i],b=sc[(i+2)%7]+(i+2>=7?12:0),c=sc[(i+4)%7]+(i+4>=7?12:0),d=sc[(i+6)%7]+(i+6>=7?12:0);
        const t3=b-a,t5=c-a,t7=d-a; const qual=t3===4&&t5===7?'':t3===3&&t5===7?'m':t3===3&&t5===6?'°':t3===4&&t5===8?'+':'?';
        const sev=qual===''?(t7===11?'maj7':'7'):qual==='m'?(t7===10?'m7':'m(maj7)'):qual==='°'?(t7===9?'°7':'ø7'):'+7';
        const root=N[(r+a)%12]; const rom=(qual==='m'||qual==='°')?rn[i].toLowerCase():rn[i];
        h+='<tr><td class="mono">'+rom+'</td><td>'+root+qual+'</td><td>'+root+sev+'</td><td class="muted mono">'+[a,b,c].map(x=>N[(r+x)%12]).join(' ')+'</td></tr>'; });
      $('#chords').innerHTML=h+'</tbody>';
    } else $('#chords').innerHTML='<tbody><tr><td class="muted">Diatonic chords shown for 7-note scales.</td></tr></tbody>';
  }
  $('#root').onchange=$('#scale').onchange=draw; draw();
  // Camelot: B = major, A = minor
  const majOrder=['B','F#','C#','G#','D#','A#','F','C','G','D','A','E'], cam={}; // 1B..12B ; B major=1B
  majOrder.forEach((k,i)=>{ cam[(i+1)+'B']=k+' major'; cam[(i+1)+'A']=N[(N.indexOf(k)+9)%12]+' minor'; });
  Object.entries(cam).sort((a,b)=>parseInt(a[0])-parseInt(b[0])||a[0].slice(-1).localeCompare(b[0].slice(-1))).forEach(([c,k])=>$('#ckey').append(SU.h('option',{value:c},c+' — '+k)));
  function drawCam(){
    const sel=$('#ckey').value, n=parseInt(sel), L=sel.slice(-1), other=L==='A'?'B':'A', w=x=>((x-1+12)%12)+1;
    const good=[sel,w(n+1)+L,w(n-1)+L,n+other]; let h='';
    ['A','B'].forEach(l=>{ h+='<div class="cam" style="margin-bottom:2px">'; for(let i=1;i<=12;i++){ const id=i+l; h+='<div class="'+(id===sel?'on':good.includes(id)?'nb':'')+'" title="'+cam[id]+'">'+id+'</div>'; } h+='</div>'; });
    $('#cam').innerHTML='<div class="small muted" style="margin-bottom:6px">Top: minor (A) · Bottom: major (B)</div>'+h+'<div class="small" style="margin-top:10px">Mixes well with: '+good.slice(1).map(g=>'<b>'+g+'</b> ('+cam[g]+')').join(' · ')+'</div>';
  }
  $('#ckey').onchange=drawCam; drawCam();
  const norm=c=>{ const m=c.match(/^([A-G][#b]?)(.*)$/); if(!m) return null; let r=m[1]; if(r.length>1&&r[1]==='b') r=N[FL[r]!==undefined?FL[r]:0]; return {r:N.indexOf(r),rest:m[2]}; };
  function tr(){ const by=+$('#tby').value||0; $('#tout').textContent=$('#tin').value.split(/\s+/).filter(Boolean).map(c=>{ const p=c.split('/').map(x=>{ const m=norm(x); return m&&m.r>=0?N[((m.r+by)%12+12)%12]+m.rest:x; }); return p.join('/'); }).join('  ');
    const o=$('#tin').value.split(/\s+/).filter(Boolean).map(norm).filter(x=>x&&x.r>=0); const best=[0,1,2,3,4,5,7].map(f=>({f,s:o.every(x=>{ const t=N[((x.r-f)%12+12)%12]; return ['C','A','G','E','D'].includes(t)||(t==='B'&&0); })?1:0})).filter(x=>x.s);
    $('#capo').textContent=best.length?'Easy open-chord shapes at capo fret '+best.map(b=>b.f).join(', ')+' (shapes from C A G E D).':'No simple capo position found for those chords.'; }
  $('#tin').oninput=$('#tby').oninput=tr; tr();
});
</script></body></html>
