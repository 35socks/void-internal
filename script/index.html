<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenplay</title><link rel="stylesheet" href="../assets/suite.css">
<style>
.sp{font-family:'Courier Prime','Courier New',monospace;font-size:12.5px;line-height:1.5;max-width:560px;margin:0 auto}
.sp .scene{font-weight:700;text-transform:uppercase;margin:22px 0 10px}.sp .act{margin:10px 0}.sp .char{margin:14px 0 0 38%;text-transform:uppercase}.sp .par{margin-left:30%;margin-right:20%}.sp .dia{margin:0 18% 0 22%}.sp .tr{text-align:right;text-transform:uppercase;margin:12px 0}.sp .ctr{text-align:center}.sp .note{color:var(--dim);font-style:italic}.sp .title{text-align:center;margin:20px 0 40px}
.outline a{display:block;padding:7px 10px;border-bottom:1px solid var(--line);font-size:11px;cursor:pointer;color:var(--dim-3)}.outline a:hover{color:var(--paper);background:var(--panel-2)}
@media print{.noprint{display:none!important}.sp{color:#000;max-width:none;font-size:12pt}.sp .note{display:none}#pvwrap{border:none}}
</style></head>
<body data-app="script"><div id="app">
<div class="row noprint" style="margin-bottom:12px"><input type="text" id="title" placeholder="Title" class="grow"><button class="btn" id="prev">Preview</button><button class="btn ghost" id="dl">.fountain ↓</button><button class="btn ghost" id="print">Print / PDF</button><button class="btn ghost" id="demo">Insert example</button></div>
<div class="cols side" style="grid-template-columns:1fr 240px">
  <div><textarea id="t" class="mono noprint" style="min-height:62vh;line-height:1.6" spellcheck="true" placeholder="INT. KITCHEN - NIGHT&#10;&#10;Rain on the window. A kettle clicks off.&#10;&#10;MAYA&#10;(quietly)&#10;You're still here.&#10;&#10;CUT TO:"></textarea>
  <div class="panel hidden" id="pvwrap" style="padding:30px 20px"><div class="sp" id="pv"></div></div></div>
  <div class="panel noprint" style="padding:0"><div style="padding:14px"><h2 style="margin:0">Outline</h2></div><div class="outline" id="out"></div><div style="padding:14px" class="small muted" id="stats"></div></div>
</div></div>
<script src="../assets/suite.js"></script>
<script>
SU.ready(()=>{
  const $=SU.$, S=SU.store.get('script',{title:'',text:''}); $('#t').value=S.text; $('#title').value=S.title;
  const save=()=>{ S.text=$('#t').value; S.title=$('#title').value; SU.store.set('script',S); };
  const e=SU.esc, inl=s=>e(s).replace(/\*\*\*(.+?)\*\*\*/g,'<b><i>$1</i></b>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/_(.+?)_/g,'<u>$1</u>').replace(/\[\[(.+?)\]\]/g,'<span class="note">[$1]</span>');
  function parse(src){
    const L=src.replace(/\r/g,'').split('\n'), out=[], scenes=[]; let lines=0, i=0, inDia=false;
    for(i=0;i<L.length;i++){ const ln=L[i], t=ln.trim(), prevBlank=i===0||!L[i-1].trim(), next=L[i+1];
      if(!t){ inDia=false; continue; }
      if(/^(\.(?!\.)|(INT|EXT|EST|INT\.?\/EXT|I\/E)[. ])/i.test(t)){ const txt=t.replace(/^\./,''); out.push('<div class="scene" id="s'+scenes.length+'">'+inl(txt)+'</div>'); scenes.push(txt); lines+=3; inDia=false; continue; }
      if(/^>.*<$/.test(t)){ out.push('<div class="ctr">'+inl(t.slice(1,-1).trim())+'</div>'); lines+=2; continue; }
      if(/^>/.test(t)||(/^[A-Z0-9 ]+TO:$/.test(t)&&prevBlank)){ out.push('<div class="tr">'+inl(t.replace(/^>\s*/,''))+'</div>'); lines+=2; continue; }
      if(inDia){ if(/^\(.*\)$/.test(t)) out.push('<div class="par">'+inl(t)+'</div>'),lines++; else { out.push('<div class="dia">'+inl(t)+'</div>'); lines+=Math.ceil(t.length/35); } continue; }
      if(prevBlank&&next&&next.trim()&&(/^@/.test(t)||(t===t.toUpperCase()&&/[A-Z]/.test(t)&&!/[a-z]/.test(t)))){ out.push('<div class="char">'+inl(t.replace(/^@/,''))+'</div>'); inDia=true; lines+=2; continue; }
      out.push('<div class="act">'+inl(t)+'</div>'); lines+=Math.ceil(t.length/60)+1; }
    return {html:out.join(''),scenes,lines}; }
  function run(){ const r=parse($('#t').value); $('#pv').innerHTML=($('#title').value?'<div class="title"><b>'+e($('#title').value.toUpperCase())+'</b></div>':'')+r.html;
    $('#out').innerHTML=r.scenes.map((s,i)=>'<a data-i="'+i+'">'+(i+1)+'. '+e(s.slice(0,40))+'</a>').join('')||'<div class="empty" style="padding:16px">No scenes yet</div>';
    const words=$('#t').value.trim()?$('#t').value.trim().split(/\s+/).length:0; $('#stats').innerHTML=r.scenes.length+' scenes · '+words+' words<br>≈ '+Math.max(0,Math.round(r.lines/55*10)/10)+' pages (~'+Math.round(r.lines/55)+' min screen time)'; save(); }
  let pv=false; const toggle=on=>{ pv=on; $('#t').classList.toggle('hidden',pv); $('#pvwrap').classList.toggle('hidden',!pv); $('#prev').textContent=pv?'Edit':'Preview'; };
  $('#prev').onclick=()=>{ run(); toggle(!pv); };
  $('#t').addEventListener('input',run); $('#title').addEventListener('input',run);
  $('#out').addEventListener('click',ev=>{ const a=ev.target.closest('a'); if(!a) return; const idx=+a.dataset.i; if(pv){ const el=document.getElementById('s'+idx); if(el) el.scrollIntoView({behavior:'smooth'}); } else { const re=/^(\.(?!\.)|(INT|EXT|EST|INT\.?\/EXT|I\/E)[. ])/i, ls=$('#t').value.split('\n'); let c=-1,pos=0; for(let k=0;k<ls.length;k++){ if(re.test(ls[k].trim())){ c++; if(c===idx){ $('#t').focus(); $('#t').setSelectionRange(pos,pos+ls[k].length); break; } } pos+=ls[k].length+1; } } });
  $('#dl').onclick=()=>SU.download(($('#title').value||'screenplay')+'.fountain',($('#title').value?'Title: '+$('#title').value+'\n\n':'')+$('#t').value);
  $('#print').onclick=()=>{ run(); toggle(true); setTimeout(()=>print(),150); };
  $('#demo').onclick=()=>{ if($('#t').value.trim()&&!confirm('Append example to current script?')) return; $('#t').value+=($('#t').value?'\n\n':'')+'INT. STUDIO - NIGHT\n\nA dim control room. Monitors glow. A half-finished mix on screen.\n\nMAYA\n(not looking up)\nIt\'s not done.\n\nJAMIE\nIt never is.\n\nShe finally turns.\n\nCUT TO:\n\nEXT. ROOFTOP - DAWN\n\nThe city wakes up below.'; run(); };
  run();
});
</script></body></html>
